# Semantic Navigation System Parameters
# All tunable parameters for the backend nodes

label_db_node:
  ros__parameters:
    db_path: "~/.semantic_nav/labels.db"
    current_map_version: ""

intent_parser_node:
  ros__parameters:
    # Leave empty: export GEMINI_API_KEY in the shell that runs the launch file instead.
    # This file is in a public repository — never put a real key here.
    gemini_api_key: ""
    model_name: "gemini-3.5-flash-lite"   # current low-latency model (gemini-2.0-flash was shut down 2026-06-01)
    request_timeout: 15.0                 # seconds (API minimum 10); on timeout or error the rule-based parser answers

target_resolver_node:
  ros__parameters:
    model_name: "all-MiniLM-L6-v2"
    epsilon: 0.05  # Similarity margin for ambiguity detection

dialogue_manager_node:
  ros__parameters:
    disambiguation_timeout: 15.0  # Seconds to wait for disambiguation response
    max_reprompts: 1  # Max re-asks before cancelling

# rosbridge configuration
rosbridge_server:
  ros__parameters:
    port: 9090
    address: ""
    retry_startup_delay: 5.0
